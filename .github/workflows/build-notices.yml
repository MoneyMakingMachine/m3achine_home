# CREQ-13: 공지 글(`_notices/*.md`)이 푸시되면 발행물(`notices/`)을 다시 만들어 같은 브랜치에 커밋한다.
#
# Pages 설정을 "deploy from branch" 그대로 두기 위한 방식이다 — 서버가 Contents API 로
# `discount-digest.json` 을 이 브랜치에 직접 커밋하고 있어서, Pages 소스를 GitHub Actions 로
# 바꾸면 digest 발행 경로까지 같이 손봐야 한다.
#
# 이 워크플로가 자기 자신을 다시 트리거하지는 않는다: 트리거는 `_notices/**` 인데 커밋하는 건
# `notices/**` 뿐이다. 서버의 digest 커밋(저장소 루트) 역시 이 워크플로를 깨우지 않는다.
#
# 설치 위치: `.github/workflows/build-notices.yml`

name: build-notices

on:
  push:
    branches: [dev]
    paths:
      - '_notices/**'
      - 'tools/build_notices.py'
      - '.github/workflows/build-notices.yml'
  workflow_dispatch:

permissions:
  contents: write

# 연달아 푸시했을 때 뒤엣것만 살려 커밋 충돌을 피한다.
concurrency:
  group: build-notices
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 의존성 설치
        run: pip install markdown PyYAML

      - name: 공지 빌드
        run: python tools/build_notices.py

      - name: 발행물 커밋
        run: |
          git config user.name  "notices-bot"
          git config user.email "notices-bot@users.noreply.github.com"
          git add -A notices
          if git diff --cached --quiet; then
            echo "생성물에 변경이 없습니다."
            exit 0
          fi
          git commit -m "chore(notices): 공지 매니페스트·페이지 자동 생성"
          git push
